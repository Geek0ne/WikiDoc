      summary: 导入 Word 文档（mammoth 出 HTML，turndown 转 Markdown，sanitize-html 消毒后落库）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, targetSpaceId]
              properties:
                file: { type: string, format: binary }
                targetSpaceId: { type: string }
                parentId: { type: string, nullable: true }
      responses:
        '202':
          description: 任务已接受，返回任务 ID
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /import/xlsx:
    post:
      operationId: importXlsx
      tags: [import]
      summary: 导入 Excel（exceljs 4.4.0，每个工作表转一篇文档或一张多维表格）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, targetSpaceId]
              properties:
                file: { type: string, format: binary }
                targetSpaceId: { type: string }
                parentId: { type: string, nullable: true }
                asDataTable:
                  type: boolean
                  default: false
                  description: true 时转为多维表格，false 时转为 Markdown 表格文档
      responses:
        '202':
          description: 任务已接受
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

