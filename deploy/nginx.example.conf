# =============================================================================
# WikiDoc 内网反向代理示例(Nginx)
# 场景:Nginx 承接宿主机 80 端口,转发到本机 Docker 暴露的 8080 端口。
# 说明:
#   - 应用层上传上限为 50MB(服务端限制),Nginx 侧放宽到 100m,
#     保证带图/带附件的长文保存不被截断;
#   - 应用无 WebSocket 依赖,无需配置 Upgrade/Connection 头。
# =============================================================================

server {
    listen 80;
    server_name wiki.example.internal;

    # 富文本图片与附件上传
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 300s;
    }
}

# 若由本层 Nginx 终止 HTTPS(对外提供 https),请同步在 docker-compose.yml 中设置:
#   WIKIDOC_COOKIE_SECURE=true                      # 启用 Cookie Secure 与 HSTS
#   WIKIDOC_PUBLIC_URL=https://wiki.example.internal  # SSO 回调与通知链接用对外地址
